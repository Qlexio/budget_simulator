[project]
name = "budget-simulator"
version = "0.1.0"
description = "French mortgage analysis: amortization tables and early repayment strategies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
]

[tool.setuptools]
packages = ["budget_simulator"]
package-dir = {"budget_simulator" = "."}

[tool.pytest.ini_options]
pythonpath = ["."]
